<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Coquette Closet 🎀</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
:root {
    --soft-pink: #fce4ec;
    --accent-pink: #e26a85;
    --hover-green: #abb039;
    --hover-lime: #e0ef70;
    --cream: #fffaf0;
    --text-color: #ba4353;
}

/* Base */
body {
    font-family: 'Quicksand', sans-serif;
    background-color: var(--soft-pink);
    color: var(--text-color);
    margin: 0;
    padding: 20px;
}

h1 {
    font-family: 'Playfair Display', serif;
    text-align: center;
    font-style: italic;
    color: var(--accent-pink);
    margin-bottom: 30px;
}

/* Controls */
.controls {
    max-width: 1100px;
    margin: 0 auto 30px auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
    background: var(--cream);
    padding: 25px;
    border-radius: 25px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
}

/* Add Item Inline */
.add-item-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 10px;
}
.add-item-row input, .add-item-row select, .add-item-row button {
    padding: 12px 16px;
    border-radius: 25px;
    border: 2px solid var(--soft-pink);
    font-family: inherit;
    outline: none;
}

/* Search Bar Bubble */
.search-bar {
    padding: 14px 20px;
    border-radius: 30px;
    border: 2px solid var(--soft-pink);
    font-family: inherit;
    outline: none;
}

/* Navbar */
.nav-menu {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 15px;
    position: relative;
}

.category-btn {
    background: var(--cream);
    border: 1px solid var(--accent-pink);
    padding: 10px 18px;
    border-radius: 25px;
    cursor: pointer;
    transition: 0.3s;
    color: var(--text-color);
    position: relative;
}

/* Hover / Active */
.category-btn:hover, .category-btn.active {
    background: var(--accent-pink);
    color: white;
}

/* Dropdown Subcategories */
.submenu {
    display: none;
    position: absolute;
    top: 100%;      /* stick right below main button */
    left: 0;
    margin-top: -5px; /* remove gap */
    background: var(--cream);
    border-radius: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    padding: 10px;
    flex-direction: column;
    gap: 5px;
    min-width: 140px;
    z-index: 10;
}
.category-btn:hover .submenu {
    display: flex;
}
.submenu button {
    padding: 8px 12px;
    border-radius: 20px;
    border: none;
    background: var(--hover-lime);
    color: var(--text-color);
    cursor: pointer;
    transition: 0.2s;
    font-size: 0.85rem;
}
.submenu button:hover {
    background: var(--accent-pink);
    color: white;
}

/* Wardrobe Grid */
.wardrobe-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 20px;
    max-width: 1200px;
    margin: 0 auto;
}
.item-card {
    background: var(--cream);
    border-radius: 20px;
    padding: 15px;
    text-align: center;
    transition: transform 0.3s ease;
    cursor: pointer;
    border: 1px solid rgba(226,106,133,0.2);
    position: relative;
}
.item-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 20px rgba(0,0,0,0.05);
}
.item-card img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    border-radius: 15px;
    margin-bottom: 10px;
}
.tag {
    display: inline-block;
    background: var(--soft-pink);
    font-size: 0.7rem;
    padding: 4px 10px;
    border-radius: 10px;
    margin: 4px;
}

/* Modal */
.modal-overlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.7);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
}
.modal-content {
    background: var(--cream);
    padding: 30px;
    border-radius: 30px;
    max-width: 500px;
    width: 90%;
    position: relative;
    text-align: center;
}
.modal-content img {
    width: 100%;
    border-radius: 20px;
    margin-bottom: 15px;
}
.close-btn {
    position: absolute;
    top: 15px; right: 20px;
    font-size: 1.5rem;
    cursor: pointer;
}

/* Delete Button inside Modal */
.delete-btn-modal {
    margin-top: 15px;
    background: var(--hover-lime);
    border: none;
    border-radius: 20px;
    padding: 8px 16px;
    cursor: pointer;
    color: #333;
    font-weight: bold;
}
</style>
</head>
<body>
<div id="app">
    <h1>🎀 My Digital Wardrobe 🎀</h1>

    <div class="controls">
        <!-- Search -->
        <input type="text" v-model="searchQuery" placeholder="Search tags or name..." class="search-bar">

        <!-- Navbar -->
        <div class="nav-menu">
            <button class="category-btn" @click="activeCat='All'" :class="{active: activeCat==='All'}">All Items</button>
            
            <div v-for="(subs, main) in categories" class="category-btn" :class="{active: activeCat===main}" @click="activeCat=main">
                {{ main }}
                <div v-if="subs.length>0" class="submenu">
                    <button v-for="sub in subs" @click.stop="activeSub=sub">{{ sub }}</button>
                    <button @click.stop="activeSub=''" style="background:#fce4ec;color:var(--text-color);border:1px solid var(--accent-pink);">Clear Sub</button>
                </div>
            </div>

            <!-- Dresses & Archive -->
            <button class="category-btn" @click="activeCat='Dresses'" :class="{active: activeCat==='Dresses'}">Dresses</button>
            <button class="category-btn" @click="activeCat='Archive'" :class="{active: activeCat==='Archive'}">Archive</button>
        </div>

        <!-- Add Item Inline -->
        <div class="add-item-row">
            <input type="text" v-model="newItem.name" placeholder="Item Name">
            <select v-model="newItem.mainCategory">
                <option v-for="(subs, cat) in categories">{{ cat }}</option>
                <option>Dresses</option>
                <option>Archive</option>
            </select>
            <input type="text" v-model="newItem.tags" placeholder="Tags (comma separated)">
            <input type="file" @change="onFileChange" accept="image/*">
            <button @click="addItem" class="category-btn" style="background: var(--accent-pink);color:white;">Add Item</button>
        </div>

        <!-- Import/Export -->
        <div style="display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;">
            <button @click="exportWardrobe" class="category-btn" style="background: var(--hover-lime);color:white;">Export</button>
            <button @click="triggerImport" class="category-btn" style="background: var(--hover-lime);color:white;">Import</button>
            <input type="file" ref="importFile" @change="importWardrobe" style="display:none;">
        </div>
    </div>

    <!-- Wardrobe Grid -->
    <div class="wardrobe-grid">
        <div v-for="item in filteredItems" :key="item.id" class="item-card" @click="selectedItem=item">
            <img :src="item.image" :alt="item.name">
            <h3>{{ item.name }}</h3>
            <p>{{ item.mainCategory }}{{ item.subCategory ? ' > '+item.subCategory : '' }}</p>
            <div>
                <span v-for="tag in item.tags" class="tag">#{{ tag }}</span>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div v-if="selectedItem" class="modal-overlay" @click.self="selectedItem=null">
        <div class="modal-content">
            <span class="close-btn" @click="selectedItem=null">&times;</span>
            <img :src="selectedItem.image">
            <h2 style="font-family:'Playfair Display'">{{ selectedItem.name }}</h2>
            <p>Category: {{ selectedItem.mainCategory }}{{ selectedItem.subCategory ? ' > '+selectedItem.subCategory : '' }}</p>
            <div class="tags">
                <span v-for="tag in selectedItem.tags" class="tag">#{{ tag }}</span>
            </div>
            <button class="delete-btn-modal" @click="deleteItem(selectedItem.id); selectedItem=null">Delete Item</button>
        </div>
    </div>
</div>

<script>
const { createApp } = Vue;
createApp({
    data() {
        return {
            searchQuery:'',
            activeCat:'All',
            activeSub:'',
            selectedItem:null,
            newItem:{name:'',mainCategory:'Tops',tags:'',image:''},
            fileData:null,
            categories:{
                'Tops':['Tanks/Halter','Casual'],
                'Bottoms':['Leisure','Jeans','Shorts','Skirts'],
                'Underwear':[],
                'Overwear':['Cardigans','Knitwear','Coats','Other'],
                'Shoes':['Heels','Casual']
            },
            items: JSON.parse(localStorage.getItem('wardrobe')) || []
        }
    },
    computed:{
        filteredItems(){
            return this.items.filter(item=>{
                const matchesSearch = item.tags.some(tag=>tag.toLowerCase().includes(this.searchQuery.toLowerCase()))||
                                      item.name.toLowerCase().includes(this.searchQuery.toLowerCase());
                const matchesCat = this.activeCat==='All' || item.mainCategory===this.activeCat;
                const matchesSub = this.activeSub==='' || item.subCategory===this.activeSub;
                return matchesSearch && matchesCat && matchesSub;
            })
        }
    },
    methods:{
        onFileChange(e){
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload=()=>{this.fileData=reader.result;}
            reader.readAsDataURL(file);
        },
        addItem(){
            if(!this.newItem.name||!this.fileData) return alert('Add name + image');
            const tagsArray = this.newItem.tags.split(',').map(t=>t.trim());
            const id=Date.now();
            this.items.push({
                id,
                name:this.newItem.name,
                mainCategory:this.newItem.mainCategory,
                subCategory:this.activeSub || '',
                tags:tagsArray,
                image:this.fileData
            });
            this.saveItems();
            this.newItem={name:'',mainCategory:'Tops',tags:'',image:''};
            this.fileData=null;
        },
        deleteItem(id){
            if(confirm('Are you sure you want to delete this item?')){
                this.items=this.items.filter(i=>i.id!==id);
                this.saveItems();
            }
        },
        saveItems(){ localStorage.setItem('wardrobe',JSON.stringify(this.items)); },
        exportWardrobe(){
            const blob=new Blob([JSON.stringify(this.items,null,2)],{type:'application/json'});
            const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
            a.download='wardrobe_backup.json'; a.click();
        },
        triggerImport(){ this.$refs.importFile.click(); },
        importWardrobe(e){
            const file=e.target.files[0];
            if(!file) return;
            const reader=new FileReader();
            reader.onload=()=>{
                this.items=JSON.parse(reader.result);
                this.saveItems();
                alert('Wardrobe Imported!');
            }
            reader.readAsText(file);
        }
    }
}).mount('#app');
</script>
</body>
</html>
